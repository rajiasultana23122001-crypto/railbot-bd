# Runs the checks a reviewer would otherwise have to run by hand: the Django
# test suite, and a frontend that still lints and builds.
#
# The risk model is built before the tests rather than committed - ml/*.pkl
# is gitignored on purpose (it is a build product of ml/train_model.py and
# the dataset beside it). Without this step the agent tests skip themselves
# on a fresh clone, which is exactly the checkout CI runs on, so the agents
# would be the least-tested part of the project here.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Django test suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check for model changes with no migration
        run: python manage.py makemigrations --check --dry-run

      - name: Build the Risk Agent's model
        run: python ml/train_model.py

      - name: Run tests
        run: python manage.py test --verbosity 2

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
